name: "🌻 JA · 🚀 Deploy Jardim"
run-name: "🚀 Jardim · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jardim-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate D1 and deploy Worker
    if: >-
      github.ref == 'refs/heads/main' &&
      !contains(fromJSON('["renovate[bot]","dependabot[bot]","renovate","dependabot"]'), github.actor)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Build application
        run: pnpm build

      - name: Apply additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply jardim --remote

      - name: Skip obsolete deployments
        id: freshness
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          LATEST_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$EXPECTED_SHA" != "$LATEST_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Newer main commit exists; skipping obsolete deployment." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy Cloudflare Worker
        if: steps.freshness.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Deployment summary
        if: success()
        run: |
          echo "### 🚀 Jardim deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Production: https://jardim.migos.club" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
