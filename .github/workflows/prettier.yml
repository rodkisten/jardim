name: "🎨 Prettier · Format Jardim"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish formatting as a PR or commit to main"
        type: choice
        required: true
        default: pr
        options:
          - pr
          - main
  schedule:
    - cron: "37 8 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jardim-prettier-main
  cancel-in-progress: false

jobs:
  format:
    name: Format and publish changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Detect formatting changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
            git diff --stat
          fi

      - name: Commit directly to main
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Prettier formatting [skip ci]"
          git push origin HEAD:main

      - name: Open or update formatting PR
        if: steps.changes.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'pr')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/prettier-format
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "style: apply Prettier formatting"
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          existing_pr="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "style: apply Prettier formatting" --body "Automated formatting only. This workflow does not block other pull requests."
          else
            gh pr create --base main --head "$BRANCH" --title "style: apply Prettier formatting" --body "Automated formatting only. This workflow does not block other pull requests."
          fi

      - name: Summary
        if: always()
        env:
          CHANGED: ${{ steps.changes.outputs.changed }}
        shell: bash
        run: |
          if [ "$CHANGED" = "false" ]; then
            echo "### ✅ Already formatted" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CHANGED" = "true" ]; then
            echo "### 🎨 Formatting changes published" >> "$GITHUB_STEP_SUMMARY"
          fi
