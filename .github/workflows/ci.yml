name: 'Validate Jardim'
run-name: '🌱 Jardim · ${{ github.ref_name }} · ${{ github.event_name }}'
on:
  push: 
    branches: [main]
  workflow_dispatch:
  pull_request:
concurrency:
  group: jardim-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: rodkisten/github/src/console-run@9d04949ee92f45bd4d9affe88a2e0104b82c97c8
        with:
          command: pnpm install --frozen-lockfile
      - uses: rodkisten/github/src/console-run@9d04949ee92f45bd4d9affe88a2e0104b82c97c8
        with:
          command: pnpm check
