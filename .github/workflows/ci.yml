name: 'Validate Jardim'
run-name: '🌱 Jardim · ${{ github.ref_name }} · ${{ github.event_name }}'
on:
  push: 
    branches: [main]
  workflow_dispatch:
  pull_request:
concurrency:
  group: jardim-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
